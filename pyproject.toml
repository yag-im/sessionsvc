[build-system]
build-backend = "hatchling.build"
requires = ["hatchling", "uv-dynamic-versioning"]

[project]
name = "sessionsvc"
dynamic = ["version"]
description = "yag app sessions manager"
authors = [{ name = "acme-im" }]
keywords = ["signaling"]
readme = "README.md"
requires-python = ">=3.14,<4"
dependencies = [
    "fastapi>=0.142.2,<1",
    "gunicorn>=23.0.0,<24",
    "opentelemetry-distro",
    "opentelemetry-exporter-otlp",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.12,<3",
    "requests>=2.32.4,<3",
    "sqlalchemy>=2.1.1,<3",
    "uvicorn-worker>=0.4.0,<1",
]

[dependency-groups]
dev = [
    "pre-commit",
    "pyright",
    "ruff",
    { include-group = "test" },
]
test = [
    "pytest",
]

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["sessionsvc"]

[tool.uv-dynamic-versioning]
vcs = "git"
style = "semver"
fallback-version = "0.0.0"

[tool.ruff]
line-length = 120
target-version = "py314"
extend-exclude = ["**/gen/*", "target"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "B",   # flake8-bugbear
    "S",   # flake8-bandit
    "C4",  # flake8-comprehensions
    "PL",  # pylint
]
ignore = [
    "E501",     # line too long, defer to formatter
    "N818",     # exception names without Error suffix
    "PLR0913",  # too many arguments
    "PLR2004",  # magic value comparison
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.ruff.lint.isort]
known-first-party = ["sessionsvc"]
split-on-trailing-comma = true

[tool.pyright]
include = ["sessionsvc"]
pythonVersion = "3.14"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
addopts = "-s -v"
markers = [
    "integration: marks integration tests",
    "unit: marks unittests"
]
testpaths = "tests"
